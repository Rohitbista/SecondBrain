[project]
name = "secondbrain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rohitbista", email = "114638542+Rohitbista@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.2",
    "fastembed>=0.9.0",
    "groq>=1.7.0",
    "gtts>=2.5.4",
    "pgvector>=0.5.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
secondbrain = "secondbrain.app.server:main"

[tool.fastapi]
entrypoint = "secondbrain.app.server:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
